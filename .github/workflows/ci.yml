name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  bash-syntax:
    name: Bash syntax (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n install.sh / catalog.sh
        run: bash -n lib/install.sh && bash -n lib/catalog.sh

  bash-tests:
    name: Bash + Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: install tests
        run: bash tests/test-install.sh
      - name: catalog tests
        run: bash tests/test-catalog.sh
      - name: find benchmark tests
        run: bash tests/test-find-benchmark.sh
      - name: auto trigger tests
        run: bash tests/test-auto-trigger.sh
      - name: antigravity tests
        run: bash tests/test-antigravity.sh
      - name: codex tests
        run: bash tests/test-codex.sh
      - name: deepseek-harness tests
        run: bash tests/test-deepseek-harness.sh

  powershell-tests:
    name: PowerShell (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: install tests
        run: pwsh -NoProfile -File tests/test-install.ps1
      - name: catalog tests
        run: pwsh -NoProfile -File tests/test-catalog.ps1
      - name: find benchmark tests
        run: pwsh -NoProfile -File tests/test-find-benchmark.ps1
      - name: auto trigger tests
        run: pwsh -NoProfile -File tests/test-auto-trigger.ps1
      - name: antigravity tests
        run: pwsh -NoProfile -File tests/test-antigravity.ps1
      - name: codex tests
        run: pwsh -NoProfile -File tests/test-codex.ps1
      - name: deepseek-harness tests
        run: pwsh -NoProfile -File tests/test-deepseek-harness.ps1

  auto-trigger:
    name: Auto-trigger test (Bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: bash tests/test-auto-trigger.sh

  auto-trigger-ps:
    name: Auto-trigger test (PowerShell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: pwsh -NoProfile -File tests/test-auto-trigger.ps1

  graduation:
    name: Graduation test (Bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: bash tests/test-graduation.sh

  graduation-ps:
    name: Graduation test (PowerShell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: pwsh -NoProfile -File tests/test-graduation.ps1

  antigravity-adapter:
    name: Antigravity adapter (Bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: bash tests/test-antigravity.sh

  antigravity-adapter-ps:
    name: Antigravity adapter (PowerShell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: pwsh -NoProfile -File tests/test-antigravity.ps1
